<!doctype html><html lang="uk"><head><meta charset="utf-8">

<meta property="og:title" content="Мед, гроші, два жала">

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0906;color:#f3e8cf;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;

  main{max-width:1100px;margin:0 auto;padding:10px 16px 80px}

<header><span>🐝 Мед, гроші, два жала</span><a href="../index.html">← до книги «Бджоли не про мед»</a></header>
<div class="hero">
  <div class="kick">вулик №7 представляє</div>
  <h1>Мед, гроші,<br>два жала</h1>
  <p class="tag">«Кожен хоче кусок стільника. Дехто хоче весь вулик.»<br>Кримінальна історія на 12 панелей.</p>

<main id="m"></main>

<script>
let h='';for(let i=1;i<=12;i++){const n=String(i).padStart(2,'0');

document.getElementById('m').innerHTML=h;
</script></body></html>
